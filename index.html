<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatha Bhakta — I design across screens and spaces</title>
<meta name="description" content="Gatha is a product designer and an architect. Work across education, healthcare, AI and 0-to-1 design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
  :root{
    --cream:#FAF6EF;
    --petal:20px;
    --petal-off:-10px;
    --pink:#F0ABCE;
    --pink-ink:#C97FA6;
    --ink:#2C2018;
    --ink-mid:#5A4535;
    --ink-soft:#8C7260;
    --border:#D9CEBD;
    --gb-serif-display:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-serif:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-sans:"DM Sans",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease:cubic-bezier(.2,0,.2,1);
    --nav-h:clamp(46px,5.2cqw,72px);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  html{background:var(--cream)}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--gb-sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}

  /* ── scroll stage ─────────────────────────────── */
  .stage{
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    background:var(--cream);
    container-type:inline-size;
    scrollbar-width:thin;
    scrollbar-color:var(--pink) rgba(44,32,24,.05);
    scroll-snap-type:y proximity;   /* nudge the work panel fully onto the frame */
  }
  .work{scroll-snap-align:start}
  .stage[data-sb="white"]{ scrollbar-color:#FFFFFF rgba(44,32,24,.10); }
  .stage::-webkit-scrollbar{width:10px}
  .stage::-webkit-scrollbar-track{background:rgba(44,32,24,.05)}
  .stage::-webkit-scrollbar-thumb{
    border-radius:999px;background:var(--pink);
    transition:background 240ms var(--ease);
  }
  .stage[data-sb="white"]::-webkit-scrollbar-thumb{background:#FFFFFF}
  .stage[data-sb="white"]::-webkit-scrollbar-track{background:rgba(44,32,24,.10)}

  /* ── sticky nav (rides above every section) ───── */
  .nav{
    position:sticky;top:0;z-index:20;
    height:var(--nav-h);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:1.3cqw 4.1cqw;gap:3.4cqw;
    background:transparent;
    transition:opacity 520ms var(--ease);
  }
  /* over a solid non-cream section the bar stays transparent —
     only the links and the mark pick up a legible on-panel ink */
  .nav__group{
    display:flex;gap:3.8cqw;
    font-family:var(--gb-sans);font-weight:600;
    font-size:clamp(9px,.95cqw,12px);line-height:1;
    letter-spacing:.2em;text-transform:uppercase;color:var(--pink-ink);
    transition:color 260ms var(--ease);
  }
  .nav__group--right{justify-content:flex-end}
  .nav__group a{transition:color 160ms var(--ease)}
  .nav__group a:hover{color:var(--ink)}
  .nav__mark{width:2.2cqw;height:2.2cqw;min-width:22px;min-height:22px;display:block;animation:gspin 40s linear infinite}
  .nav__mark path{fill:var(--pink);transition:fill 260ms var(--ease)}
  .nav--solid .nav__group{ color:var(--nav-ink,var(--cream)); }
  .nav--solid .nav__mark path{ fill:var(--nav-ink,var(--cream)); }

  /* ── hero (sticky) ────────────────────────────── */
  .hero{
    position:sticky;top:0;
    height:100dvh;min-height:600px;
    margin-top:calc(-1 * var(--nav-h, 0px));   /* nav overlays; hero centres in the full viewport */
    background:var(--cream);
    z-index:2;
    transform-origin:50% 50%;
    will-change:transform,opacity;
  }

  /* ── hero centrepiece + hover playground ──────── */
  .play{
    position:relative;
    height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:0 3cqw;
  }

  .claim{
    position:relative;
    border:1px solid var(--border);border-radius:4px;
    padding:3.4cqw 4.2cqw;
    display:flex;flex-direction:column;align-items:center;gap:1.9cqw;
    background:rgba(250,246,239,.72);
    max-width:66cqw;
    z-index:1;
    transition:border-color 640ms var(--ease),background-color 640ms var(--ease);
  }

  /* the four corner ticks are the mark's four petals, each SVG
     view-boxed onto one quarter of the 342×342 quatrefoil */
  .claim__tick{
    position:absolute;
    width:var(--petal);height:var(--petal);
    display:block;z-index:2;
    transform:rotate(var(--rot,0deg));
    transform-origin:50% 50%;
  }
  .claim__tick svg{display:block;width:100%;height:100%;overflow:hidden}
  .claim__tick path{fill:var(--pink)}
  .claim__tick--tl{left:var(--petal-off);top:var(--petal-off)}
  .claim__tick--tr{right:var(--petal-off);top:var(--petal-off)}
  .claim__tick--bl{left:var(--petal-off);bottom:var(--petal-off)}
  .claim__tick--br{right:var(--petal-off);bottom:var(--petal-off)}
  .claim__tick--fly{transition:transform 1120ms cubic-bezier(.2,.94,.24,1)}

  /* ── intro: the mark blooms centre-screen, then its petals scatter
     out to become the claim-box corners while the hero fades up ── */
  .intro{
    position:fixed;inset:0;z-index:6;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .intro__mark{
    width:272px;height:272px;display:block;
    opacity:0;transform:scale(.58) rotate(-26deg);
    transition:transform 1180ms var(--ease-out),opacity 560ms var(--ease);
  }
  .intro__petals path{fill:var(--pink)}
  .intro--in .intro__mark{opacity:1;transform:scale(1) rotate(0deg)}
  .intro--out .intro__mark{
    transform:scale(.06) rotate(150deg);
    transition:transform 820ms cubic-bezier(.36,0,.22,1);
  }
  .intro--out .intro__petals{visibility:hidden}
  .intro--gone{display:none}

  /* hero content held back while the intro plays */
  .stage--intro .nav{opacity:0;pointer-events:none}
  .stage--intro .claim{border-color:transparent;background:transparent}
  .stage--intro .claim h1,
  .stage--intro .claim__lede,
  .stage--intro .claim__areas,
  .stage--intro .scrib{opacity:0;transform:translateY(12px)}
  .claim h1,.claim__lede,.claim__areas{
    transition:opacity 700ms var(--ease),transform 700ms var(--ease-out);
  }
  .claim__lede{transition-delay:90ms}
  .claim__areas{transition-delay:180ms}
  .scrib{transition-property:left,top,transform,opacity}

  .claim h1{
    margin:0;
    font-family:var(--gb-serif-display);font-weight:400;
    font-size:clamp(40px,6.4cqw,104px);
    line-height:1.06;letter-spacing:-.025em;
    color:var(--ink);text-align:center;max-width:76cqw;
  }
  .claim__lede{
    margin:0;
    font-family:var(--gb-serif);
    font-size:clamp(16px,2.1cqw,30px);
    line-height:1.45;color:var(--ink-mid);
    text-align:center;max-width:52cqw;
  }
  .claim__areas{
    display:flex;align-items:center;gap:1.6cqw;
    font-family:var(--gb-sans);font-weight:600;
    font-size:clamp(9px,1cqw,13px);line-height:1;
    letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
  }
  .claim__dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}

  /* ── flying cutouts (hero) ───────────────────── */
  .cutout{
    position:absolute;left:50%;top:50%;
    width:auto;object-fit:contain;pointer-events:none;
    transform:translate(-50%,-50%) scale(.25);
    opacity:0;
    transition:transform 620ms cubic-bezier(.34,1.56,.64,1),opacity 340ms ease;
    filter:drop-shadow(0 12px 26px rgba(44,32,24,.20));
    z-index:3;
  }
  .cutout--ph{
    display:flex;align-items:flex-end;justify-content:center;
    border-radius:10px;
    background:#FDFBF7;border:1px solid var(--border);
    box-shadow:inset 0 0 0 4px #fff;
    font-family:var(--gb-serif);font-style:italic;
    color:var(--ink-soft);font-size:12px;
    padding:8px 12px;
  }

  /* ── scribbles (pixel-art star / heart) ──────── */
  .scrib{
    position:absolute;
    transform:translate(-50%,-50%);
    transition:left 1400ms var(--ease),top 1400ms var(--ease),transform 1400ms var(--ease);
    pointer-events:none;z-index:2;
  }
  .scrib img{
    display:block;width:100%;height:100%;image-rendering:pixelated;
    animation:gpulse 5s ease-in-out infinite;
  }
  @keyframes gpulse{
    0%,100%{opacity:.55;transform:scale(.92)}
    50%{opacity:1;transform:scale(1.06)}
  }

  /* ── selected work — 7b × 7c hybrid ───────────────────────
     One screen-framed panel, its content group centred and clear of the
     sticky nav. A multi-filterable filmstrip walked by the arrows or by
     the wheel — but only once the panel has fully settled. Hovering a
     card tints the whole field to that project's wash, springs four
     cut-outs onto the thumbnail corners (7c) and peels a fifth off to
     trail the cursor (7b). Every measure is a cq unit on .work. */
  .work{
    position:relative;z-index:3;
    width:100%;
    height:100dvh;min-height:540px;
    container-type:size;
    overflow:hidden;
  }
  .work__field{
    position:relative;height:100%;
    background:var(--pink);
    transition:background 900ms var(--ease);
    padding:calc(var(--nav-h, 54px) + clamp(8px,1.6cqh,22px)) 0 clamp(16px,3cqh,44px);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .work__frame{
    width:min(1180px,100%);margin-inline:auto;
    padding-inline:clamp(20px,4.1cqw,68px);
    flex:1;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
  }
  .work__head{
    display:flex;align-items:baseline;justify-content:space-between;gap:2cqw;
    padding-bottom:clamp(10px,1.8cqh,22px);
  }
  .work__eyebrow{
    font:600 clamp(12px,1.7cqw,22px)/1 var(--gb-sans);
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  }
  .work__count{
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.55);
  }

  .work__chips{
    display:flex;flex-wrap:wrap;gap:.8cqw;
    padding-bottom:clamp(10px,1.6cqh,20px);
  }
  .work__chips button{
    cursor:pointer;
    padding:clamp(5px,.7cqh,10px) clamp(11px,1.5cqw,20px);
    border-radius:999px;border:1px solid rgba(44,32,24,.3);background:rgba(250,246,239,.45);
    font:600 clamp(9px,.92cqw,12px)/1 var(--gb-sans);
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    transition:background 260ms var(--ease),color 260ms var(--ease),border-color 260ms var(--ease);
  }
  .work__chips button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  /* fixed height + top-aligned cards → a pill change never nudges them */
  .work__strip-wrap{
    flex:0 0 auto;
    height:clamp(300px,33cqw,452px);
    display:flex;align-items:flex-start;
    overflow:clip;overflow-clip-margin:4cqw;
  }
  .work__strip{display:flex;width:max-content;transition:transform 600ms var(--ease)}

  .qc{
    flex:0 0 auto;
    width:clamp(236px,29cqw,420px);margin-right:clamp(16px,2.3cqw,38px);
    min-height:clamp(290px,31cqw,420px);
    display:flex;flex-direction:column;gap:clamp(5px,.7cqw,11px);
    cursor:pointer;opacity:.5;
    overflow:clip;overflow-clip-margin:4cqw;
    transition:width 520ms var(--ease),margin-right 520ms var(--ease),opacity 380ms ease;
  }
  .qc.is-current{opacity:1}
  .qc.is-hidden{width:0;margin-right:0;opacity:0;pointer-events:none}
  .qc__thumb{
    position:relative;height:clamp(116px,16cqw,236px);border-radius:4px;
    border:1px solid rgba(44,32,24,.22);background:rgba(250,246,239,.7);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:clamp(3px,.5cqw,8px);
  }
  .qc__img{height:72%;width:auto;object-fit:contain}
  .qc__corner{
    position:absolute;width:clamp(42px,4.6cqw,66px);height:clamp(42px,4.6cqw,66px);
    object-fit:contain;pointer-events:none;z-index:5;
    transform:translate(-50%,-50%) scale(.25);opacity:0;
    transition:transform 620ms cubic-bezier(.34,1.56,.64,1),opacity 340ms ease;
  }
  .qc__corner[data-c="0"]{left:0;top:18%}
  .qc__corner[data-c="1"]{left:100%;top:10%}
  .qc__corner[data-c="2"]{left:8%;top:100%}
  .qc__corner[data-c="3"]{left:100%;top:80%}
  .qc.is-hot .qc__corner{opacity:1}
  .qc.is-hot .qc__corner[data-c="0"]{transform:translate(-50%,-50%) scale(1) rotate(-14deg);transition-delay:0ms}
  .qc.is-hot .qc__corner[data-c="1"]{transform:translate(-50%,-50%) scale(1) rotate(11deg);transition-delay:80ms}
  .qc.is-hot .qc__corner[data-c="2"]{transform:translate(-50%,-50%) scale(1) rotate(8deg);transition-delay:160ms}
  .qc.is-hot .qc__corner[data-c="3"]{transform:translate(-50%,-50%) scale(1) rotate(-9deg);transition-delay:240ms}
  .qc__meta{
    display:flex;align-items:baseline;justify-content:space-between;
    font:400 clamp(9px,.9cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .qc__title{
    margin:0;font-family:var(--gb-serif);font-weight:400;
    font-size:clamp(17px,2cqw,27px);line-height:1.12;color:var(--ink);
  }
  .qc__desc{
    margin:0;font:300 clamp(10px,1cqw,13px)/1.55 var(--gb-sans);color:rgba(44,32,24,.7);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }

  .work__nav{display:flex;align-items:center;gap:1.2cqw;padding-top:clamp(10px,1.6cqh,20px)}
  .work__arrow{
    cursor:pointer;
    width:clamp(30px,3.2cqw,44px);height:clamp(30px,3.2cqw,44px);
    border-radius:50%;border:1px solid rgba(44,32,24,.35);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font:400 clamp(12px,1.2cqw,17px)/1 var(--gb-sans);color:var(--ink);
    transition:background 240ms var(--ease),opacity 240ms var(--ease);
  }
  .work__arrow:hover{background:rgba(250,246,239,.6)}
  .work__arrow[disabled]{opacity:.3;cursor:default}
  .work__prog{flex:1;height:1px;background:rgba(44,32,24,.22);position:relative;margin-left:1.4cqw}
  .work__prog i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0;transition:width 600ms var(--ease)}

  .work__lead{
    position:absolute;left:0;top:0;
    width:clamp(46px,5cqw,74px);height:clamp(46px,5cqw,74px);object-fit:contain;
    pointer-events:none;z-index:8;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    transition:transform 420ms cubic-bezier(.34,1.56,.64,1),opacity 300ms ease;
    filter:drop-shadow(0 10px 20px rgba(44,32,24,.2));
  }

  .colophon{
    padding-top:clamp(12px,2cqh,24px);
    display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .colophon a:hover{color:var(--ink)}

  @keyframes gspin{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    .hero{min-height:560px}
    .nav{padding:12px 20px;gap:16px}
    .nav__group{gap:16px;font-size:9px}
    .claim{padding:34px 24px;gap:16px;max-width:88vw}
    .claim h1{font-size:clamp(30px,9vw,44px);max-width:none}
    .claim__lede{font-size:15px;max-width:38ch}
    .claim__areas{font-size:9px;gap:10px;flex-wrap:wrap;justify-content:center}
    .cutout{display:none}
    .work__field{padding:48px 0 40px}
    .work__frame{padding-inline:20px}
    .work__eyebrow,.work__count{font-size:10px}
    .work__chips{gap:8px}
    .work__chips button{font-size:10px;padding:7px 13px}
    .qc{width:78vw;margin-right:16px;gap:10px}
    .qc__thumb{height:44vw}
    .qc__corner{width:52px;height:52px}
    .qc__title{font-size:clamp(18px,5.4vw,26px)}
    .qc__desc{font-size:13px}
    .work__arrow{width:38px;height:38px;font-size:15px}
    .work__lead{display:none}
    .colophon{flex-direction:column;gap:6px;font-size:10px}
  }

  @media (prefers-reduced-motion:reduce){
    .nav__mark{animation:none}
    .scrib img{animation:none;opacity:1;transform:none}
    .cutout,.qc__corner,.work__lead{transition:opacity 200ms linear}
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="intro" id="intro" aria-hidden="true">

    </svg>
  </div>

  <nav class="nav">
    <div class="nav__group">
      <a href="#work">Work</a>
      <a href="#" aria-disabled="true">Resume</a>
    </div>
    <svg class="nav__mark" viewBox="0 0 342 342" aria-hidden="true">

<script>
(function(){
  "use strict";

  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function asset(name){ return 'assets/' + encodeURI(name); }
  function $(sel){ return document.querySelector(sel); }
  function byId(id){ return document.getElementById(id); }

  var stage = byId('stage');
  var play  = byId('play');
  var hero  = $('.hero');
  var nav   = $('.nav');
  var claimEl = $('.claim');
  var solids = document.querySelectorAll('[data-solidbg]');
  var introDone = false;
  var spread = null;

  /* ── scroll: scrollbar flip · hero recede · nav contrast ──
     As the pink work panel slides up the hero eases back (a fade and
     a barely-there 3% scale-down), and the sticky nav swaps its links
     to a legible on-panel ink once a solid section is behind it. */
  var scrollPending = false;
  function paint(){
    scrollPending = false;
    var ch = stage.clientHeight, st = stage.scrollTop;

    stage.setAttribute('data-sb', st > ch * 0.5 ? 'white' : 'pink');

    var p = Math.min(1, st / (ch * 0.62));
    hero.style.opacity = (1 - p * 0.5).toFixed(3);
    hero.style.transform = reduce ? 'none' : 'scale(' + (1 - p * 0.03).toFixed(4) + ')';

    // flip at the nav's mid-line so the transition reads cleanly
    var mid = nav.offsetHeight * 0.5, onSolid = false;
    for (var i = 0; i < solids.length; i++){
      var r = solids[i].getBoundingClientRect();
      if (r.top <= mid && r.bottom > mid){ onSolid = true; break; }
    }
    nav.classList.toggle('nav--solid', onSolid);
  }
  function onScroll(){ if (!scrollPending){ scrollPending = true; requestAnimationFrame(paint); } }
  stage.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  onScroll();

  /* ── hero: flying cut-outs ──────────────────────────────
     Six sticker photos that spring out from behind the claim box
     when the pointer grazes its edge, and retract when it leaves. */
  var CUTS = [
    { file:'cheesecake.webp',    label:'cheesecake',     h:109 },
    { file:'CHAICROISSANT.webp', label:'chai croissant', h:120 },
    { file:'matcha.webp',        label:'matcha',         h:184 },
    { file:'nycmodel.webp',      label:'new york',       h:116 },
    { file:'Gatha 1.webp',       label:'gatha',          h:190 },
    { file:'wip logo 1.webp',    label:'mark',           h:101 }
  ];
  var SLOTS = [[430, -206], [455, 8], [415, 212]];   // px offsets on a 1160-wide hero, per tier
  var K = 1;

  function jitter(n){ return (Math.random() - 0.5) * n; }
  function scaleFactor(){ return Math.max(0.62, Math.min(1.5, window.innerWidth / 1160)); }

  function makeSpread(){
    var left = [], right = [];
    SLOTS.forEach(function(s){
      var dx = -Math.abs(jitter(26)), dy = jitter(30), rot = Math.round(jitter(22));
      left.push ({ tx: Math.round(-s[0] - dx), ty: Math.round(s[1] + dy), rot: -rot });
      right.push({ tx: Math.round( s[0] + dx), ty: Math.round(s[1] + dy), rot:  rot });
    });
    return left.concat(right);
  }

  var cutEls = CUTS.map(function(c, i){
    var el = document.createElement('img');
    el.className = 'cutout';
    el.alt = '';
    el.src = asset(c.file);
    el.dataset.baseH = c.h;
    el.onerror = function(){
      // graceful placeholder until the sticker art is present in /assets
      var ph = document.createElement('div');
      ph.className = 'cutout cutout--ph';
      ph.dataset.baseH = c.h;
      ph.textContent = c.label;
      el.replaceWith(ph);
      cutEls[i] = ph;
      resizeCuts();
    };
    play.appendChild(el);
    return el;
  });

  function resizeCuts(){
    K = scaleFactor();
    cutEls.forEach(function(el){
      var h = (el.dataset.baseH | 0) * K;
      el.style.height = h + 'px';
      if (el.classList.contains('cutout--ph')) el.style.width = Math.round(h * 1.35) + 'px';
    });
    if (spread) applyCuts(true);
  }

  // pull a sticker's horizontal offset back in if the spread would push
  // its box off the screen — leaves a 32px gutter
  function clampX(el, tx){
    var half = (el.offsetWidth || (el.dataset.baseH | 0) * K * 1.4) / 2;
    var lim = Math.max(0, window.innerWidth / 2 - half - 32);
    return Math.max(-lim, Math.min(lim, tx));
  }

  function applyCuts(on){
    cutEls.forEach(function(el, i){
      if (on && spread){
        var s = spread[i];
        el.style.transitionDelay = (80 * i) + 'ms';
        el.style.transform = 'translate(-50%,-50%) translate(' + clampX(el, s.tx * K) + 'px,' + (s.ty * K) + 'px) rotate(' + s.rot + 'deg) scale(1)';
        el.style.opacity = '1';
      } else {
        el.style.transitionDelay = (50 * (5 - i)) + 'ms';
        el.style.transform = 'translate(-50%,-50%) scale(.25)';
        el.style.opacity = '0';
      }
    });
  }

  resizeCuts();
  window.addEventListener('resize', resizeCuts);

  // distance from a point to the claim box edge (negative = inside)
  var EDGE_IN = 46, EDGE_OUT = 104;   // hysteresis band around the border
  function edgeDist(x, y){
    var r = claimEl.getBoundingClientRect();
    var dx = Math.max(r.left - x, x - r.right, 0);
    var dy = Math.max(r.top - y, y - r.bottom, 0);
    if (dx || dy) return Math.sqrt(dx * dx + dy * dy);
    return -Math.min(x - r.left, r.right - x, y - r.top, r.bottom - y);
  }
  play.addEventListener('mousemove', function(e){
    if (!introDone) return;
    var d = edgeDist(e.clientX, e.clientY);
    if (!spread && d < EDGE_IN){ spread = makeSpread(); applyCuts(true); }
    else if (spread && d > EDGE_OUT){ applyCuts(false); spread = null; }
  });
  play.addEventListener('mouseleave', function(){ applyCuts(false); spread = null; });

  /* ── hero: pixel-art scribbles ──────────────────────────
     Seven star/heart pixels in a loose ring around the claim box;
     they pulse in place and re-roll to fresh spots every few seconds. */
  var STAR  = { src:asset('cross-grid.svg'),  w:54, h:54 };
  var HEART = { src:asset('pixel-heart.svg'), w:50, h:57 };
  var SCRIBS = [
    { art:STAR,  x:[3.6, 6.2],   y:[30, 44], dur:4.4,  del:0   },
    { art:HEART, x:[4.2, 6.8],   y:[58, 74], dur:5.4,  del:0.8 },
    { art:HEART, x:[93.4, 96.2], y:[26, 40], dur:4.75, del:0.25 },
    { art:STAR,  x:[93.0, 95.8], y:[56, 72], dur:5.8,  del:1   },
    { art:STAR,  x:[19, 34],     y:[5, 12],  dur:4.9,  del:1.5 },
    { art:HEART, x:[64, 80],     y:[6, 13],  dur:6.2,  del:0.5 },
    { art:STAR,  x:[38, 62],     y:[87, 94], dur:5.1,  del:1.9 }
  ];
  var scribEls = SCRIBS.map(function(s, n){
    var wrap = document.createElement('div');
    wrap.className = 'scrib scrib--' + n;
    wrap.style.width = s.art.w + 'px';
    wrap.style.height = s.art.h + 'px';
    wrap.innerHTML = '<img src="' + s.art.src + '" alt="" width="' + s.art.w + '" height="' + s.art.h +
      '" style="animation-duration:' + s.dur + 's;animation-delay:' + s.del + 's">';
    play.appendChild(wrap);
    return { el:wrap, cfg:s };
  });
  function rand(a, b){ return a + Math.random() * (b - a); }
  function rollScribs(){
    scribEls.forEach(function(o){
      var x = Math.round(rand(o.cfg.x[0], o.cfg.x[1]) * 10) / 10;
      var y = Math.round(rand(o.cfg.y[0], o.cfg.y[1]) * 10) / 10;
      o.el.style.left = x + '%';
      o.el.style.top  = y + '%';
      o.el.style.transform = 'translate(-50%,-50%) rotate(' + Math.round(rand(-24, 24)) + 'deg)';
    });
  }
  rollScribs();
  if (!reduce) setInterval(rollScribs, 6500);

  /* ── intro: the mark blooms centre-screen, then its four petals fly
     out to the corners of the claim box while the hero fades up ── */
  (function intro(){
    var el = byId('intro');
    if (!el) return;
    var ticks = [].slice.call(document.querySelectorAll('.claim__tick'));
    var DIRS = [[-1,-1],[1,-1],[-1,1],[1,1]];   // tl, tr, bl, br
    var timers = [];
    function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

    // park each tick centre-screen, scaled up to petal size, invisible
    function park(){
      var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      ticks.forEach(function(t, i){
        var r = t.getBoundingClientRect(), d = DIRS[i];
        t.classList.remove('claim__tick--fly');
        t.style.opacity = '0';
        t.style.transform =
          'translate(' + Math.round(cx - (r.left + r.width / 2) + d[0] * 68) + 'px,' +
                         Math.round(cy - (r.top + r.height / 2) + d[1] * 68) + 'px) ' +
          'rotate(var(--rot,0deg)) scale(6.8)';
      });
    }
    // let them spring home to their corners
    function release(){
      ticks.forEach(function(t){
        t.classList.add('claim__tick--fly');
        t.style.opacity = '1';
        t.style.transform = '';
      });
    }

    function run(){
      timers.forEach(clearTimeout); timers = [];
      introDone = false; applyCuts(false); spread = null;
      el.classList.remove('intro--in', 'intro--out', 'intro--gone');
      stage.classList.add('stage--intro');
      park();
      var prevOverflow = stage.style.overflowY;
      stage.style.overflowY = 'hidden';

      at(40,   function(){ el.classList.add('intro--in'); });
      at(1300, function(){
        // hand-off in one frame: the real ticks appear exactly where the
        // clipped petals sit, so the shape simply continues — nothing fades
        ticks.forEach(function(t){ t.style.opacity = '1'; });
        el.classList.add('intro--out');
      });
      at(1340, release);
      at(1560, function(){ stage.classList.remove('stage--intro'); });
      at(2200, function(){
        introDone = true;
        el.classList.add('intro--gone');
        stage.style.overflowY = prevOverflow;
      });
    }

    if (reduce){
      ticks.forEach(function(t){ t.style.opacity = '1'; });
      introDone = true;
      el.classList.add('intro--gone');
      return;
    }

    run();
    var navMark = $('.nav__mark');
    if (navMark){
      navMark.style.cursor = 'pointer';
      navMark.setAttribute('title', 'Replay intro');
      navMark.addEventListener('click', function(){
        var scrolled = stage.scrollTop > 4;
        if (scrolled) stage.scrollTo({ top:0, behavior:'smooth' });
        setTimeout(run, scrolled ? 420 : 0);
      });
    }
  })();

  /* ── work section — 7b × 7c hybrid carousel ─────────────
     A multi-filterable filmstrip walked by the arrows or the wheel
     (only once the panel has settled). Hovering a card tints the
     field to that project's wash, springs four cut-outs onto the
     thumbnail corners (7c) and trails a fifth on the cursor (7b). */
  (function workCarousel(){
    var field   = byId('workField');
    var strip   = byId('workStrip');
    var stripWrap = byId('workStripWrap');
    var chipBox = byId('workChips');
    var countEl = byId('workCount');
    var progEl  = byId('workProg');
    var prevB   = byId('workPrev');
    var nextB   = byId('workNext');
    var lead    = byId('workLead');
    var workSec = byId('work');
    if (!field) return;

    var PROJECTS = [
      { no:'01', img:'nycmodel.webp',      tag:'Interior',   meta:'Interior · 2024',          title:'House of small rooms',                     desc:'A 62 m² flat re-planned as nine thresholds instead of four rooms.',  tint:'#EDD8CC' },
      { no:'02', img:'matcha.webp',        tag:'AI',         meta:'AI · 0-to-1 · 2026',       title:'A copilot that admits it is unsure',        desc:'Confidence made legible, so people stop trusting the wrong answer.',  tint:'#D8E8D4' },
      { no:'03', img:'CHAICROISSANT.webp', tag:'Education',   meta:'Education · 2025',         title:'A museum game for ten-year-olds',           desc:'Forty minutes in a gallery, played on one shared tablet.',            tint:'#FADCEB' },
      { no:'04', img:'cheesecake.webp',    tag:'Research',    meta:'Research · growth · 2025', title:'Where platform growth actually comes from', desc:'Nine months of interviews turned into three decisions.',              tint:'#F2EDE4' },
      { no:'05', img:'Gatha 1.webp',       tag:'Healthcare', meta:'Healthcare · 2025',        title:'Ward rounds, rebuilt',                      desc:"Eleven minutes saved per round, on the ward's own hardware.",         tint:'#E2ECE6' }
    ];
    var TAGS = ['All', 'Interior', 'AI', 'Education', 'Research', 'Healthcare'];
    var CORNER_SEQ = ['matcha.webp', 'CHAICROISSANT.webp', 'cheesecake.webp', 'Gatha 1.webp', 'wip logo 1.webp', 'nycmodel.webp'];

    var sel = [];              // selected tag names — multi-select; empty = all
    var car = 0, hot = null;
    var cursor = { x:0, y:0, on:false };

    // Darkest monochrome of the panel's own hue that still clears 4.5:1
    // against it — so nav links stay legible on a pastel wash.
    function navInkOn(hex){
      var h = hex.replace('#', '');
      var r = parseInt(h.slice(0, 2), 16) / 255,
          g = parseInt(h.slice(2, 4), 16) / 255,
          b = parseInt(h.slice(4, 6), 16) / 255;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), delta = mx - mn;
      var hue = 0, sat = 0, lig = (mx + mn) / 2;
      if (delta){
        sat = delta / (1 - Math.abs(2 * lig - 1));
        hue = mx === r ? ((g - b) / delta + (g < b ? 6 : 0))
            : mx === g ? (b - r) / delta + 2
            : (r - g) / delta + 4;
        hue *= 60;
      }
      sat = Math.min(sat, 0.52);

      function toLinear(v){ return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
      function luminance(c){ return 0.2126 * toLinear(c[0]) + 0.7152 * toLinear(c[1]) + 0.0722 * toLinear(c[2]); }
      function hslToRgb(H, S, L){
        var C = (1 - Math.abs(2 * L - 1)) * S;
        var X = C * (1 - Math.abs((H / 60) % 2 - 1));
        var m = L - C / 2;
        var t = H < 60 ? [C, X, 0] : H < 120 ? [X, C, 0] : H < 180 ? [0, C, X]
              : H < 240 ? [0, X, C] : H < 300 ? [X, 0, C] : [C, 0, X];
        return [t[0] + m, t[1] + m, t[2] + m];
      }

      var panelLum = luminance([r, g, b]), out = [0, 0, 0];
      for (var L = 0.42; L >= 0.06; L -= 0.02){
        out = hslToRgb(hue, sat, L);
        if ((panelLum + 0.05) / (luminance(out) + 0.05) >= 4.5) break;
      }
      return '#' + out.map(function(v){
        return ('0' + Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16)).slice(-2);
      }).join('');
    }

    var chipEls = TAGS.map(function(t, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t;
      b.addEventListener('click', function(){
        if (i === 0){ sel = []; }
        else {
          var at = sel.indexOf(t);
          if (at === -1) sel.push(t); else sel.splice(at, 1);
        }
        car = 0; hot = null; render();
      });
      chipBox.appendChild(b);
      return b;
    });

    var cardEls = PROJECTS.map(function(p, i){
      var el = document.createElement('article');
      el.className = 'qc';
      var corners = '';
      for (var k = 0; k < 4; k++){
        corners += '<img class="qc__corner" data-c="' + k + '" alt="" src="' + asset(CORNER_SEQ[(i + k) % 6]) + '">';
      }
      el.innerHTML =
        '<div class="qc__thumb"><img class="qc__img" alt="" src="' + asset(p.img) + '">' + corners + '</div>' +
        '<div class="qc__meta"><span>' + p.no + '</span><span>' + p.meta + '</span></div>' +
        '<h3 class="qc__title">' + p.title + '</h3>' +
        '<p class="qc__desc">' + p.desc + '</p>';
      el.addEventListener('mouseenter', function(){ if (!el.classList.contains('is-hidden')){ hot = i; render(); } });
      el.addEventListener('mouseleave', function(){ if (hot === i){ hot = null; render(); } });
      el.addEventListener('click', function(){
        var pos = filtered().indexOf(i);
        if (pos !== -1) car = pos;
        hot = i; render();
      });
      strip.appendChild(el);
      return el;
    });

    function filtered(){
      var out = [];
      for (var i = 0; i < PROJECTS.length; i++){
        if (sel.length === 0 || sel.indexOf(PROJECTS[i].tag) !== -1) out.push(i);
      }
      return out;
    }
    function pad(n){ return String(n).padStart(2, '0'); }

    function step(d){
      var n = filtered().length;
      car = Math.max(0, Math.min(n - 1, car + d));
      render();
    }

    function render(){
      var list = filtered(), n = list.length;
      if (car > n - 1) car = Math.max(0, n - 1);

      chipEls.forEach(function(b, i){
        var on = i === 0 ? sel.length === 0 : sel.indexOf(TAGS[i]) !== -1;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      cardEls.forEach(function(el, i){
        var pos = list.indexOf(i);
        el.classList.toggle('is-hidden', pos === -1);
        el.classList.toggle('is-current', hot != null ? hot === i : pos === car);
        el.classList.toggle('is-hot', hot === i);
      });

      var first = cardEls[list[0]];
      var stepPx = first.offsetWidth + parseFloat(getComputedStyle(first).marginRight || 0);
      strip.style.transform = 'translateX(' + (-car * stepPx) + 'px)';

      if (hot != null){
        field.style.background = PROJECTS[hot].tint;
        stage.style.setProperty('--nav-ink', navInkOn(PROJECTS[hot].tint));
      } else {
        field.style.background = '';               // back to the base pink
        stage.style.removeProperty('--nav-ink');   // base panel keeps the cream nav
      }

      countEl.textContent = pad(n ? Math.min(car + 1, n) : 0) + ' / ' + pad(n);
      progEl.style.width = n ? ((car + 1) / n * 100) + '%' : '0';
      prevB.disabled = car <= 0;
      nextB.disabled = car >= n - 1;

      paintLead();
    }

    function paintLead(){
      var base = 'translate(-50%,-50%) translate(' + cursor.x + 'px,' + cursor.y + 'px) ';
      if (hot != null && cursor.on){
        var src = asset(PROJECTS[hot].img);
        if (lead.getAttribute('src') !== src) lead.src = src;
        lead.style.opacity = '1';
        lead.style.transform = base + 'scale(1) rotate(' + (hot % 2 ? 10 : -10) + 'deg)';
      } else {
        lead.style.opacity = '0';
        lead.style.transform = base + 'scale(.4)';
      }
    }

    var leadPending = false;
    field.addEventListener('mousemove', function(e){
      var r = field.getBoundingClientRect();
      cursor.x = e.clientX - r.left;
      cursor.y = e.clientY - r.top;
      cursor.on = true;
      if (!leadPending){ leadPending = true; requestAnimationFrame(function(){ leadPending = false; paintLead(); }); }
    });
    field.addEventListener('mouseleave', function(){ cursor.on = false; hot = null; render(); });

    // wheel walks the strip — but only once .work has settled against the
    // top; before that the wheel scrolls the panel into place
    var wheelAt = 0;
    stripWrap.addEventListener('wheel', function(e){
      if (workSec.getBoundingClientRect().top > 1) return;
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 4) return;
      var n = filtered().length;
      var canGo = d > 0 ? car < n - 1 : car > 0;
      if (!canGo) return;                     // at an end → release to the page
      e.preventDefault();                     // walking the carousel — hold the page,
      var now = Date.now();                   // even through the step throttle
      if (now - wheelAt < 320) return;
      wheelAt = now;
      step(d > 0 ? 1 : -1);
    }, { passive:false });

    prevB.addEventListener('click', function(){ step(-1); });
    nextB.addEventListener('click', function(){ step(1); });
    window.addEventListener('resize', render);

    render();
  })();
})();
</script>
</body>
</html>
