<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatha Bhakta — designs both screens and spaces</title>
<meta name="description" content="Gatha is a product designer and an architect. Work across education, healthcare, AI and 0-to-1 design.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
  :root{
    --cream:#FAF6EF;
    --card:#FAF6EF;
    --line:#D0C4B0;
    --tan:140,114,96;
    --pink:#F0ABCE;
    --pink-ink:#C97FA6;
    --pink-rule:#E9A8C6;
    --ink:#2C2018;
    --ink-mid:#5A4535;
    --ink-soft:#8C7260;
    --border:#D9CEBD;
    --gb-serif-display:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-serif:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-sans:"DM Sans",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease:cubic-bezier(.2,0,.2,1);
    --nav-h:clamp(46px,5.2cqw,72px);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  html{background:var(--cream)}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--gb-sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}

  /* ── scroll stage ─────────────────────────────── */
  .stage{
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    background:var(--cream);
    container-type:inline-size;
    scrollbar-width:thin;
    scrollbar-color:var(--pink) rgba(44,32,24,.05);
    scroll-snap-type:y proximity;   /* nudge the work panel fully onto the frame */
  }
  .work{scroll-snap-align:start}
  .stage[data-sb="white"]{ scrollbar-color:#FFFFFF rgba(44,32,24,.10); }
  .stage::-webkit-scrollbar{width:10px}
  .stage::-webkit-scrollbar-track{background:rgba(44,32,24,.05)}
  .stage::-webkit-scrollbar-thumb{
    border-radius:999px;background:var(--pink);
    transition:background 240ms var(--ease);
  }
  .stage[data-sb="white"]::-webkit-scrollbar-thumb{background:#FFFFFF}
  .stage[data-sb="white"]::-webkit-scrollbar-track{background:rgba(44,32,24,.10)}

  /* ── sticky nav (rides above every section) ───── */
  .nav{
    position:sticky;top:0;z-index:20;
    height:var(--nav-h);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:1.3cqw 4.1cqw;gap:3.4cqw;
    background:transparent;
    transition:opacity 520ms var(--ease);
  }
  .nav__group{
    display:flex;gap:3.8cqw;
    font-family:var(--gb-sans);font-weight:600;
    font-size:clamp(9px,.95cqw,12px);line-height:1;
    letter-spacing:.2em;text-transform:uppercase;color:var(--pink-ink);
    transition:color 260ms var(--ease);
  }
  .nav__group--right{justify-content:flex-end}
  .nav__group a{transition:color 160ms var(--ease)}
  .nav__group a:hover{color:var(--ink)}
  .nav__mark{width:2.2cqw;height:2.2cqw;min-width:22px;min-height:22px;display:block;cursor:pointer;animation:gspin 40s linear infinite}
  .nav__mark path{fill:var(--pink);transition:fill 260ms var(--ease)}
  .nav--solid .nav__group{ color:var(--nav-ink,var(--cream)); }
  .nav--solid .nav__mark path{ fill:var(--nav-ink,var(--cream)); }

  /* ── hero (sticky) ────────────────────────────────────────────────
     7A · the locked Swiss grid. Six regions on one frame, measured off
     the final comp: ruler edge · graph-paper column · dot-field bands ·
     claim card · checker base · isometric column. All copy is live text. */
  .hero{
    position:sticky;top:0;
    height:100dvh;min-height:600px;
    margin-top:calc(-1 * var(--nav-h, 0px));   /* nav overlays; the frame fills the viewport */
    background:var(--cream);
    overflow:hidden;
    display:flex;justify-content:center;
    z-index:2;
    transform-origin:50% 50%;
    will-change:transform,opacity;
  }
  /* the composition is authored at 1280 — past that it stops growing and
     sits centred, so wide screens stay balanced instead of ballooning.
     cqw units below all resolve against this frame, not the viewport. */
  .hero__frame{
    position:relative;
    width:100%;max-width:1280px;height:100%;
    container-type:inline-size;
    --petal:clamp(24px,3.1cqw,50px);
    --petal-off:calc(var(--petal) / -2);
  }

  /* the frame */
  .grid{
    position:absolute;inset:0;display:grid;
    grid-template-columns:3.125% 19.097% 55.556% 22.222%;
    grid-template-rows:7.37% 19.22% 46.196% 27.21%;
    transition:opacity 800ms var(--ease);
  }
  .cell{position:relative;overflow:hidden;transition:opacity 820ms var(--ease)}

  /* ruler edge — pink rules along the left margin, lifted under the nav */
  .ruler{
    position:absolute;left:0;top:calc(7.37% - 30px);bottom:0;width:3.125%;z-index:2;
    opacity:.42;background-repeat:repeat-y;background-position:0 -18px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 44px);
            mask-image:linear-gradient(to bottom,transparent 0,#000 44px);
    transition:opacity 800ms var(--ease);
  }

  /* graph-paper column — same lift, so the sheet dissolves into the nav */
  .cell--graph{overflow:visible;cursor:crosshair}
  .cell--graph .pat{
    position:absolute;inset:-30px 0 0 0;opacity:.42;
    background-repeat:repeat;background-position:0 -18px;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 44px);
            mask-image:linear-gradient(to bottom,transparent 0,#000 44px);
  }
  .xh{position:absolute;background:var(--pink-ink);opacity:0;transition:opacity 200ms var(--ease);z-index:3;pointer-events:none}
  .xh--v{top:0;bottom:0;width:1px;transform:translateX(var(--cx,0px))}
  .xh--h{left:0;right:0;height:1px;transform:translateY(var(--cy,0px))}
  .xh--node{
    width:9px;height:9px;background:transparent;border:1.5px solid var(--pink-rule);border-radius:50%;
    transform:translate(calc(var(--cx,0px) - 4.5px),calc(var(--cy,0px) - 4.5px));
  }
  .cell--graph:hover .xh{opacity:.7}
  .cell--graph:hover .xh--node{opacity:1}

  /* dot-field bands */
  .cell--dot .pat{position:absolute;inset:0;opacity:.42;background-repeat:repeat;background-position:0 0}
  .cell--dot .hot{
    position:absolute;inset:0;opacity:0;transition:opacity 420ms var(--ease);
    background-image:radial-gradient(circle at 1px 1px,rgba(240,171,206,.95) 1.8px,transparent 2.4px);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(circle 170px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.55) 45%,transparent 72%);
            mask-image:radial-gradient(circle 170px at var(--mx,50%) var(--my,50%),#000 0%,rgba(0,0,0,.55) 45%,transparent 72%);
  }
  .cell--dot:hover .hot{opacity:1}

  /* checker base */
  .check{position:absolute;inset:0;display:grid}
  .wc{background:transparent;transition:background-color 900ms var(--ease)}
  .wc--odd{background:#F2EDE4}
  .wc--on{background:rgba(240,171,206,.5);transition:background-color 90ms linear}

  /* isometric column */
  .cell--iso{background:transparent}
  .iso__grid{opacity:.42}
  .cell--iso svg{display:block;width:100%;height:100%}

  /* claim card */
  .cell--claim{overflow:visible;z-index:6}
  .card{
    position:absolute;inset:0;background:var(--card);border:1px solid #D9CEBD;
    transition:border-color 640ms var(--ease),background-color 640ms var(--ease);
  }
  .claim{position:absolute;inset:0}
  .claim__eyebrow{
    position:absolute;left:12.29%;top:11.72%;
    font-family:var(--gb-serif);font-weight:400;font-size:2.778cqw;line-height:1;
    color:var(--ink-mid);white-space:nowrap;
  }
  .claim__w1,.claim__w2{
    position:absolute;font-family:var(--gb-serif);font-weight:500;font-size:7.407cqw;line-height:1;
    color:var(--ink);white-space:nowrap;
  }
  .claim__w1{left:11.77%;top:21.89%}
  .claim__w2{left:46.25%;top:47.09%}
  .claim__amp{
    position:absolute;left:35.37%;top:40.11%;z-index:3;
    font-family:var(--gb-serif);font-style:italic;font-weight:400;font-size:10.44cqw;line-height:1;
    color:var(--pink);
    transform:rotate(2.61deg);transform-origin:0 0;
    -webkit-text-stroke:.405cqw #FFFFFF;paint-order:stroke fill;
    filter:drop-shadow(0 .23cqw .23cqw rgba(0,0,0,.25));
  }
  .claim__note{
    position:absolute;left:8.02%;top:54.45%;width:26.25%;margin:0;z-index:2;text-align:right;
    font-family:var(--gb-serif);font-weight:400;font-size:1.389cqw;line-height:1.29;
    color:#000000;white-space:nowrap;
  }
  .claim__areas{
    position:absolute;left:11.35%;top:84.3%;z-index:2;display:flex;align-items:center;gap:.52cqw;
    font-family:var(--gb-sans);font-weight:400;font-size:1.157cqw;line-height:1;
    color:var(--ink-soft);white-space:nowrap;
  }
  .claim__areas i{color:var(--pink);font-style:normal;font-size:1.3cqw;line-height:0}

  /* the four corner ticks are the mark's four petals, each SVG
     view-boxed onto one quarter of the 342×342 quatrefoil */
  .claim__tick{
    position:absolute;width:var(--petal);height:var(--petal);display:block;z-index:7;
    transform:rotate(var(--rot));transform-origin:50% 50%;
  }
  .claim__tick svg{display:block;width:100%;height:100%;overflow:hidden}
  .claim__tick path{fill:var(--pink)}
  .claim__tick--tl{left:var(--petal-off);top:var(--petal-off);--rot:0deg}
  .claim__tick--tr{right:var(--petal-off);top:var(--petal-off);--rot:0deg}
  .claim__tick--bl{left:var(--petal-off);bottom:var(--petal-off);--rot:0deg}
  .claim__tick--br{right:var(--petal-off);bottom:var(--petal-off);--rot:0deg}
  .claim__tick--fly{transition:transform 1120ms cubic-bezier(.2,.94,.24,1)}

  .claim__eyebrow,.claim__w1,.claim__w2,.claim__amp,.claim__note,.claim__areas{
    transition:opacity 700ms var(--ease),transform 700ms var(--ease-out);
  }
  .claim__w1{transition-delay:60ms}
  .claim__amp{transition-delay:120ms}
  .claim__w2{transition-delay:170ms}
  .claim__note{transition-delay:220ms}
  .claim__areas{transition-delay:280ms}

  /* tapes — laid with the background, never animated */
  .tapes{position:absolute;inset:0;z-index:3;pointer-events:none}
  .tape{position:absolute;background-repeat:no-repeat;background-size:100% 100%;background-position:50% 50%}
  .stage--intro .tapes{display:none}

  /* stickers — spring in, then draggable anywhere on the hero */
  .stk{
    position:absolute;z-index:12;display:block;height:auto;opacity:0;cursor:grab;
    touch-action:none;user-select:none;-webkit-user-drag:none;
    transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) rotate(calc(var(--rot,0deg) + var(--gr,0deg))) scale(.22);
    transition:transform 620ms cubic-bezier(.34,1.56,.64,1),opacity 340ms ease;
  }
  .stk--sq{aspect-ratio:1;height:auto;object-fit:contain}
  .stk--in{opacity:1;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) rotate(calc(var(--rot,0deg) + var(--gr,0deg))) scale(var(--gs,1))}
  .stk--drag{transition:none;cursor:grabbing;z-index:30;--gr:5deg;--gs:1.07;filter:drop-shadow(0 10px 18px rgba(44,32,24,.22))}
  .stk--drag.stk--ccw{--gr:-5deg}
  .stk--settle{transition:transform 540ms cubic-bezier(.34,1.5,.64,1);z-index:30}

  /* ── intro: the mark blooms centre-screen, then its petals scatter
     out to become the claim-card corners while the frame fades up ── */
  .intro{
    position:fixed;inset:0;z-index:9;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .intro__mark{
    width:272px;height:272px;display:block;
    opacity:0;transform:scale(.58) rotate(-26deg);
    transition:transform 1180ms var(--ease-out),opacity 560ms var(--ease);
  }
  .intro__petals path{fill:var(--pink)}
  .intro--in .intro__mark{opacity:1;transform:scale(1) rotate(0deg)}
  .intro--out .intro__mark{
    transform:scale(.06) rotate(150deg);
    transition:transform 820ms cubic-bezier(.36,0,.22,1);
  }
  .intro--out .intro__petals{visibility:hidden}
  .intro--gone{display:none}

  /* hero content held back while the intro plays */
  .stage--intro .nav{opacity:0;pointer-events:none}
  .stage--intro .cell--graph,
  .stage--intro .cell--dot,
  .stage--intro .cell--check,
  .stage--intro .cell--iso{opacity:0}
  .stage--intro .ruler{opacity:0}
  .stage--intro .card{border-color:transparent;background:transparent}
  .stage--intro .claim__eyebrow,
  .stage--intro .claim__w1,
  .stage--intro .claim__w2,
  .stage--intro .claim__amp,
  .stage--intro .claim__note,
  .stage--intro .claim__areas{opacity:0;transform:translateY(12px)}

  /* narrow: the frame collapses, the card carries the screen */
  @container (max-width:820px){
    .grid{grid-template-columns:1fr;grid-template-rows:var(--nav-h) 1fr}
    .cell:not(.cell--claim){display:none}
    .cell--claim{grid-area:2 / 1 / 3 / 2}
    .ruler,.claim__tick,.tapes,.stk{display:none}
    .card{border:0}
    .claim__eyebrow{font-size:5cqw;top:8%}
    .claim__w1,.claim__w2{font-size:13cqw}
    .claim__w1{top:20%}
    .claim__w2{left:30%;top:44%}
    .claim__amp{font-size:22cqw;left:6%;top:33%}
    .claim__note{font-size:3.6cqw;width:52%;left:44%;top:62%;text-align:left}
    .claim__areas{font-size:2.3cqw;white-space:normal;flex-wrap:wrap;bottom:6%}
  }

  /* ── selected work — 7b × 7c hybrid ───────────────────────
     One screen-framed panel, its content group centred and clear of the
     sticky nav. A multi-filterable filmstrip walked by the arrows or by
     the wheel — but only once the panel has fully settled. Hovering a
     card tints the whole field to that project's wash, springs four
     cut-outs onto the thumbnail corners (7c) and peels a fifth off to
     trail the cursor (7b). Every measure is a cq unit on .work. */
  .work{
    position:relative;z-index:3;
    width:100%;
    height:100dvh;min-height:540px;
    container-type:size;
    overflow:hidden;
  }
  .work__field{
    position:relative;height:100%;
    background:var(--pink);
    transition:background 900ms var(--ease);
    padding:calc(var(--nav-h, 54px) + clamp(8px,1.6cqh,22px)) 0 clamp(16px,3cqh,44px);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .work__frame{
    width:min(1180px,100%);margin-inline:auto;
    padding-inline:clamp(20px,4.1cqw,68px);
    flex:1;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
  }
  .work__head{
    display:flex;align-items:baseline;justify-content:space-between;gap:2cqw;
    padding-bottom:clamp(10px,1.8cqh,22px);
  }
  .work__eyebrow{
    font:600 clamp(12px,1.7cqw,22px)/1 var(--gb-sans);
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  }
  .work__count{
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.55);
  }

  .work__chips{
    display:flex;flex-wrap:wrap;gap:.8cqw;
    padding-bottom:clamp(10px,1.6cqh,20px);
  }
  .work__chips button{
    cursor:pointer;
    padding:clamp(5px,.7cqh,10px) clamp(11px,1.5cqw,20px);
    border-radius:999px;border:0;background:rgba(250,246,239,.45);
    font:600 clamp(9px,.92cqw,12px)/1 var(--gb-sans);
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    transition:background 260ms var(--ease),color 260ms var(--ease);
  }
  .work__chips button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}

  /* fixed height + top-aligned cards → a pill change never nudges them */
  .work__strip-wrap{
    flex:0 0 auto;
    height:clamp(300px,33cqw,452px);
    display:flex;align-items:flex-start;
    overflow:clip;overflow-clip-margin:4cqw;
  }
  .work__strip{display:flex;width:max-content;transition:transform 600ms var(--ease)}

  .qc{
    flex:0 0 auto;
    width:clamp(236px,29cqw,420px);margin-right:clamp(16px,2.3cqw,38px);
    min-height:clamp(290px,31cqw,420px);
    display:flex;flex-direction:column;gap:clamp(5px,.7cqw,11px);
    cursor:pointer;opacity:.5;
    overflow:clip;overflow-clip-margin:4cqw;
    transition:width 520ms var(--ease),margin-right 520ms var(--ease),opacity 380ms ease;
  }
  .qc.is-current{opacity:1}
  .qc.is-hidden{width:0;margin-right:0;opacity:0;pointer-events:none}
  .qc__thumb{
    position:relative;height:clamp(116px,16cqw,236px);border-radius:4px;
    background:rgba(250,246,239,.7);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:clamp(3px,.5cqw,8px);
  }
  .qc__img{height:72%;width:auto;object-fit:contain}
  /* wizzy pixel-art clippie (PNG) — keep the grid crisp, don't let the browser smooth it */
  .qc__img[src$=".png"],
  .work__lead[src$=".png"]{image-rendering:pixelated}
  .qc__corner{
    position:absolute;width:clamp(42px,4.6cqw,66px);height:clamp(42px,4.6cqw,66px);
    object-fit:contain;pointer-events:none;z-index:5;
    transform:translate(-50%,-50%) scale(.25);opacity:0;
    transition:transform 620ms cubic-bezier(.34,1.56,.64,1),opacity 340ms ease;
  }
  .qc__corner[data-c="0"]{left:0;top:18%}
  .qc__corner[data-c="1"]{left:100%;top:10%}
  .qc__corner[data-c="2"]{left:8%;top:100%}
  .qc__corner[data-c="3"]{left:100%;top:80%}
  .qc.is-hot .qc__corner{opacity:1}
  .qc.is-hot .qc__corner[data-c="0"]{transform:translate(-50%,-50%) scale(1) rotate(-14deg);transition-delay:0ms}
  .qc.is-hot .qc__corner[data-c="1"]{transform:translate(-50%,-50%) scale(1) rotate(11deg);transition-delay:80ms}
  .qc.is-hot .qc__corner[data-c="2"]{transform:translate(-50%,-50%) scale(1) rotate(8deg);transition-delay:160ms}
  .qc.is-hot .qc__corner[data-c="3"]{transform:translate(-50%,-50%) scale(1) rotate(-9deg);transition-delay:240ms}
  .qc__meta{
    display:flex;align-items:baseline;justify-content:space-between;
    font:400 clamp(9px,.9cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .qc__title{
    margin:0;font-family:var(--gb-serif);font-weight:400;
    font-size:clamp(17px,2cqw,27px);line-height:1.12;color:var(--ink);
  }
  .qc__desc{
    margin:0;font:300 clamp(10px,1cqw,13px)/1.55 var(--gb-sans);color:rgba(44,32,24,.7);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }

  .work__nav{display:flex;align-items:center;gap:1.2cqw;padding-top:clamp(10px,1.6cqh,20px)}
  .work__arrow{
    cursor:pointer;
    width:clamp(30px,3.2cqw,44px);height:clamp(30px,3.2cqw,44px);
    border-radius:50%;border:1px solid rgba(44,32,24,.35);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font:400 clamp(12px,1.2cqw,17px)/1 var(--gb-sans);color:var(--ink);
    transition:background 240ms var(--ease),opacity 240ms var(--ease);
  }
  .work__arrow:hover{background:rgba(250,246,239,.6)}
  .work__arrow[disabled]{opacity:.3;cursor:default}
  .work__prog{flex:1;height:1px;background:rgba(44,32,24,.22);position:relative;margin-left:1.4cqw}
  .work__prog i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0;transition:width 600ms var(--ease)}

  .work__lead{
    position:absolute;left:0;top:0;
    width:clamp(46px,5cqw,74px);height:clamp(46px,5cqw,74px);object-fit:contain;
    pointer-events:none;z-index:8;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    transition:transform 420ms cubic-bezier(.34,1.56,.64,1),opacity 300ms ease;
    filter:drop-shadow(0 10px 20px rgba(44,32,24,.2));
  }

  .colophon{
    padding-top:clamp(12px,2cqh,24px);
    display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .colophon a:hover{color:var(--ink)}

  @keyframes gspin{to{transform:rotate(360deg)}}

  @media (max-width:720px){
    .hero{min-height:560px}
    .nav{padding:12px 20px;gap:16px}
    .nav__group{gap:16px;font-size:9px}
    .work__field{padding:48px 0 40px}

(function(){

  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ── scroll: scrollbar flip · hero recede · nav contrast ──
     As the pink work panel slides up the hero eases back (a fade and
     a barely-there 3% scale-down), and the sticky nav swaps its links
     to a legible on-panel ink once a solid section is behind it. */
  var scrollPending = false;
  function paint(){
    scrollPending = false;
    var ch = stage.clientHeight, st = stage.scrollTop;

    stage.setAttribute('data-sb', st > ch * 0.5 ? 'white' : 'pink');

    var p = Math.min(1, st / (ch * 0.62));
    hero.style.opacity = (1 - p * 0.5).toFixed(3);
    hero.style.transform = reduce ? 'none' : 'scale(' + (1 - p * 0.03).toFixed(4) + ')';

    var mid = nav.offsetHeight * 0.5, onSolid = false;
    for (var i = 0; i < solids.length; i++){
      var r = solids[i].getBoundingClientRect();
      if (r.top <= mid && r.bottom > mid){ onSolid = true; break; }
    }
    nav.classList.toggle('nav--solid', onSolid);
  }
  function onScroll(){ if (!scrollPending){ scrollPending = true; requestAnimationFrame(paint); } }
  stage.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  onScroll();

  /* ── hero — 7A locked grid ─────────────────────────────────────────
     Exact tiles from the design file. Graph + ruler are the attached
     SVGs, re-tiled to 88px so the 44px major module repeats without
     doubling. Everything sizes off the viewport. */
  (function heroGrid(){
    var GRID_LINE = '#E0D4C8', RULE_MINOR = '#E2B3CB', RULE_MAJOR = '#D96EA4';

    function svgUrl(w, h, body){
      return "url('data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" fill="none">' + body + '</svg>'
      ).replace(/'/g, '%27') + "')";
    }

    /* module = one major square; the tile is 2× so the major repeats
       without doubling. Dialled down from the design's 44 to keep the
       grid quiet on the real page. */
    var GS = 38, TILE = GS * 2;
    function minors(len){
      var q = GS / 4, out = [];
      for (var m = 0; m < 2; m++) for (var k = 1; k < 4; k++) out.push((m * GS + k * q + 0.25).toFixed(2));
      return out;
    }

    var GRAPH_TILE = (function(){
      var b = '', minor = minors(), i;
      for (i = 0; i < minor.length; i++){
        b += '<line x1="0" y1="' + minor[i] + '" x2="' + TILE + '" y2="' + minor[i] + '" stroke="' + GRID_LINE + '" stroke-width="0.5"/>';
        b += '<line x1="' + minor[i] + '" y1="0" x2="' + minor[i] + '" y2="' + TILE + '" stroke="' + GRID_LINE + '" stroke-width="0.5"/>';
      }
      b += '<line x1="0" y1="0.5" x2="' + TILE + '" y2="0.5" stroke="' + GRID_LINE + '"/>';
      b += '<line x1="0" y1="' + (GS + 0.5) + '" x2="' + TILE + '" y2="' + (GS + 0.5) + '" stroke="' + GRID_LINE + '"/>';
      b += '<line x1="0.5" y1="0" x2="0.5" y2="' + TILE + '" stroke="' + GRID_LINE + '"/>';
      b += '<line x1="' + (GS + 0.5) + '" y1="0" x2="' + (GS + 0.5) + '" y2="' + TILE + '" stroke="' + GRID_LINE + '"/>';
      return svgUrl(TILE, TILE, b);
    })();

    var RULER_TILE = (function(){
      var b = '', minor = minors(), i;
      for (i = 0; i < minor.length; i++){
        b += '<line x1="0.5" y1="' + minor[i] + '" x2="18.5" y2="' + minor[i] + '" stroke="' + RULE_MINOR + '" stroke-width="0.5"/>';

      b += '<line x1="1" y1="0" x2="1" y2="' + TILE + '" stroke="' + RULE_MAJOR + '" stroke-width="2"/>';
      b += '<line x1="0.5" y1="1" x2="30.5" y2="1" stroke="' + RULE_MAJOR + '" stroke-width="2"/>';
      b += '<line x1="0.5" y1="' + (GS + 1) + '" x2="30.5" y2="' + (GS + 1) + '" stroke="' + RULE_MAJOR + '" stroke-width="2"/>';
      return svgUrl(48, TILE, b);

    // wheel walks the strip — but only once .work has settled against the
    // top; before that the wheel scrolls the panel into place
    var wheelAt = 0;
    stripWrap.addEventListener('wheel', function(e){
      if (workSec.getBoundingClientRect().top > 1) return;
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 4) return;
      var n = filtered().length;
      var canGo = d > 0 ? car < n - 1 : car > 0;
      if (!canGo) return;                     // at an end → release to the page
      e.preventDefault();                     // walking the carousel — hold the page,
      var now = Date.now();                   // even through the step throttle
      if (now - wheelAt < 320) return;
      wheelAt = now;
      step(d > 0 ? 1 : -1);
    }, { passive:false });

    prevB.addEventListener('click', function(){ step(-1); });
    nextB.addEventListener('click', function(){ step(1); });
    window.addEventListener('resize', render);

    render();
  })();
})();
</script>
</body>
</html>
