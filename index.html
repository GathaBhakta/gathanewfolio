<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatha Bhakta — I design across screens and spaces</title>
<meta name="description" content="Gatha is a product designer and an architect. 0-to-1 design for education, healthcare and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap">
<style>
  :root{
    --cream:#FAF6EF;
    --pink:#F0ABCE;
    --pink-ink:#C97FA6;
    --ink:#2C2018;
    --ink-mid:#5A4535;
    --ink-soft:#8C7260;
    --border:#D9CEBD;
    --gb-serif-display:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-serif:"Lora","JejuMyeongjo",Georgia,serif;
    --gb-sans:"DM Sans",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease:cubic-bezier(.2,0,.2,1);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:var(--gb-sans);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none}

  /* ── scroll stage ─────────────────────────────── */
  .stage{
    height:100dvh;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    background:var(--cream);
    container-type:inline-size;
    scrollbar-width:thin;
    scrollbar-color:var(--pink) rgba(44,32,24,.05);
    scroll-snap-type:y proximity;   /* nudge the work panel fully onto the frame */
  }
  .work{scroll-snap-align:start}
  .stage[data-sb="white"]{ scrollbar-color:#FFFFFF rgba(44,32,24,.10); }
  .stage::-webkit-scrollbar{width:10px}
  .stage::-webkit-scrollbar-track{background:rgba(44,32,24,.05)}
  .stage::-webkit-scrollbar-thumb{
    border-radius:999px;background:var(--pink);
    transition:background 240ms var(--ease);
  }
  .stage[data-sb="white"]::-webkit-scrollbar-thumb{background:#FFFFFF}
  .stage[data-sb="white"]::-webkit-scrollbar-track{background:rgba(44,32,24,.10)}

  /* ── sticky nav (rides above every section) ───── */
  .nav{
    position:sticky;top:0;z-index:20;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:1.3cqw 4.1cqw;gap:3.4cqw;
    background:transparent;
  }
  /* over a solid non-cream section the bar stays transparent —
     only the wordmark, links and mark pick up the hero's cream */
  .nav--solid .nav__group{ color:var(--cream); }
  .nav--solid .nav__mark path{ fill:var(--cream); }

  /* ── hero (sticky) ────────────────────────────── */
  .hero{
    position:sticky;top:0;
    height:100dvh;min-height:600px;
    margin-top:calc(-1 * var(--nav-h, 0px));   /* nav overlays; hero centres in the full viewport */
    background:var(--cream);
    z-index:2;
    transform-origin:50% 50%;
    will-change:transform,opacity;
  }
  .nav__group{
    display:flex;gap:3.8cqw;
    font-family:var(--gb-sans);font-weight:600;
    font-size:clamp(9px,.95cqw,12px);line-height:1;
    letter-spacing:.2em;text-transform:uppercase;color:var(--pink-ink);
  }
  .nav__group--right{justify-content:flex-end}
  .nav__group{transition:color 260ms var(--ease)}
  .nav__group a{transition:color 160ms var(--ease)}
  .nav__group a:hover{color:var(--ink)}
  .nav__mark{width:2.2cqw;height:2.2cqw;min-width:22px;min-height:22px;display:block;animation:gspin 40s linear infinite}
  .nav__mark path{fill:var(--pink);transition:fill 260ms var(--ease)}

  /* ── hero centrepiece + hover playground ──────── */
  .play{
    position:relative;
    height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:0 3cqw;
  }

  .claim{
    position:relative;
    border:1px solid var(--border);border-radius:4px;
    padding:3.4cqw 4.2cqw;
    display:flex;flex-direction:column;align-items:center;gap:1.9cqw;
    background:rgba(250,246,239,.72);
    max-width:84cqw;
    z-index:1;
  }
  /* stickers + scribbles ride ABOVE the hairline claim box */
  .claim__tick{position:absolute;width:7px;height:7px;background:var(--pink)}
  .claim__tick--tl{left:-4px;top:-4px}
  .claim__tick--tr{right:-4px;top:-4px}
  .claim__tick--bl{left:-4px;bottom:-4px}
  .claim__tick--br{right:-4px;bottom:-4px}

  .claim h1{
    margin:0;
    font-family:var(--gb-serif-display);font-weight:400;
    font-size:clamp(40px,6.4cqw,104px);
    line-height:1.06;letter-spacing:-.025em;
    color:var(--ink);text-align:center;max-width:76cqw;
  }
  .claim__lede{
    margin:0;
    font-family:var(--gb-serif);
    font-size:clamp(16px,2.1cqw,30px);
    line-height:1.45;color:var(--ink-mid);
    text-align:center;max-width:52cqw;
  }
  .claim__areas{
    display:flex;align-items:center;gap:1.6cqw;
    font-family:var(--gb-sans);font-weight:600;
    font-size:clamp(9px,1cqw,13px);line-height:1;
    letter-spacing:.24em;text-transform:uppercase;color:var(--ink);
  }
  .claim__dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}

  /* ── flying cutouts ──────────────────────────── */
  .cutout{
    position:absolute;left:50%;top:50%;
    width:auto;object-fit:contain;pointer-events:none;
    transform:translate(-50%,-50%) scale(.55);
    opacity:0;
    transition:transform 760ms var(--ease-out),opacity 620ms var(--ease);
    filter:drop-shadow(0 12px 26px rgba(44,32,24,.20));
    z-index:3;
  }
  .cutout--ph{
    display:flex;align-items:flex-end;justify-content:center;
    border-radius:10px;
    background:#FDFBF7;border:1px solid var(--border);
    box-shadow:inset 0 0 0 4px #fff;
    font-family:var(--gb-serif);font-style:italic;
    color:var(--ink-soft);font-size:12px;
    padding:8px 12px;
  }

  /* ── scribbles ───────────────────────────────── */
  .scrib{
    position:absolute;
    transform:translate(-50%,-50%);
    transition:left 1400ms var(--ease),top 1400ms var(--ease),transform 1400ms var(--ease);
    pointer-events:none;z-index:2;
  }
  .scrib svg{display:block;overflow:visible}
  .scrib path{
    fill:none;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;
    stroke-dasharray:240;
  }
  .scrib--0 path,.scrib--4 path{stroke:#E8C98A}
  .scrib--1 path{stroke:var(--pink)}
  .scrib--0 path{animation:gscribble 4.4s ease-in-out 0s infinite}
  .scrib--1 path{animation:gscribble 4.75s ease-in-out .25s infinite}
  .scrib--4 path{animation:gscribble 5.8s ease-in-out 1s infinite}

  /* ── selected work — 7b × 7c hybrid ───────────────────────
     One screen-framed panel, its content group centred and clear of the
     sticky nav. A multi-filterable filmstrip walked by the arrows or by
     the wheel — but only once the panel has fully settled. Hovering a
     card tints the whole field to that project's wash, springs four
     cut-outs onto the thumbnail corners (7c) and peels a fifth off to
     trail the cursor (7b). Every measure is a cq unit on .work. */
  .work{
    position:relative;z-index:3;
    width:100%;
    height:100dvh;min-height:540px;
    container-type:size;
    overflow:hidden;
  }
  .work__field{
    position:relative;height:100%;
    background:var(--pink);
    transition:background 900ms var(--ease);
    /* top pad clears the sticky nav; group is then centred in the rest */
    padding:calc(var(--nav-h, 54px) + clamp(8px,1.6cqh,22px)) 0 clamp(16px,3cqh,44px);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .work__frame{
    width:min(1180px,100%);margin-inline:auto;
    padding-inline:clamp(20px,4.1cqw,68px);
    flex:1;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
  }
  .work__head{
    display:flex;align-items:baseline;justify-content:space-between;gap:2cqw;
    padding-bottom:clamp(10px,1.8cqh,22px);
  }
  .work__eyebrow{
    font:600 clamp(12px,1.7cqw,22px)/1 var(--gb-sans);
    letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  }
  .work__count{
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.55);
  }

  .work__chips{
    display:flex;flex-wrap:wrap;gap:.8cqw;
    padding-bottom:clamp(10px,1.6cqh,20px);
  }
  .work__chips button{
    cursor:pointer;
    padding:clamp(5px,.7cqh,10px) clamp(11px,1.5cqw,20px);
    border-radius:999px;border:1px solid rgba(44,32,24,.3);background:rgba(250,246,239,.45);
    font:600 clamp(9px,.92cqw,12px)/1 var(--gb-sans);
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);
    transition:background 260ms var(--ease),color 260ms var(--ease),border-color 260ms var(--ease);
  }
  .work__chips button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  /* fixed height + top-aligned cards → a pill change never nudges them */
  .work__strip-wrap{
    flex:0 0 auto;
    height:clamp(300px,33cqw,452px);
    display:flex;align-items:flex-start;
    overflow:clip;overflow-clip-margin:4cqw;
  }
  .work__strip{display:flex;width:max-content;transition:transform 600ms var(--ease)}

  .qc{
    flex:0 0 auto;
    width:clamp(236px,29cqw,420px);margin-right:clamp(16px,2.3cqw,38px);
    min-height:clamp(290px,31cqw,420px);
    display:flex;flex-direction:column;gap:clamp(5px,.7cqw,11px);
    cursor:pointer;opacity:.5;
    overflow:clip;overflow-clip-margin:4cqw;
    transition:width 520ms var(--ease),margin-right 520ms var(--ease),opacity 380ms ease;
  }
  .qc.is-current{opacity:1}
  .qc.is-hidden{width:0;margin-right:0;opacity:0;pointer-events:none}
  .qc__thumb{
    position:relative;height:clamp(116px,16cqw,236px);border-radius:4px;
    border:1px solid rgba(44,32,24,.22);background:rgba(250,246,239,.7);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:clamp(3px,.5cqw,8px);
  }
  .qc__img{height:72%;width:auto;object-fit:contain}
  .qc__corner{
    position:absolute;width:clamp(42px,4.6cqw,66px);height:clamp(42px,4.6cqw,66px);
    object-fit:contain;pointer-events:none;z-index:5;
    transform:translate(-50%,-50%) scale(.25);opacity:0;
    transition:transform 620ms cubic-bezier(.34,1.56,.64,1),opacity 340ms ease;
  }
  .qc__corner[data-c="0"]{left:0;top:18%}
  .qc__corner[data-c="1"]{left:100%;top:10%}
  .qc__corner[data-c="2"]{left:8%;top:100%}
  .qc__corner[data-c="3"]{left:100%;top:80%}
  .qc.is-hot .qc__corner{opacity:1}
  .qc.is-hot .qc__corner[data-c="0"]{transform:translate(-50%,-50%) scale(1) rotate(-14deg);transition-delay:0ms}
  .qc.is-hot .qc__corner[data-c="1"]{transform:translate(-50%,-50%) scale(1) rotate(11deg);transition-delay:80ms}
  .qc.is-hot .qc__corner[data-c="2"]{transform:translate(-50%,-50%) scale(1) rotate(8deg);transition-delay:160ms}
  .qc.is-hot .qc__corner[data-c="3"]{transform:translate(-50%,-50%) scale(1) rotate(-9deg);transition-delay:240ms}
  .qc__meta{
    display:flex;align-items:baseline;justify-content:space-between;
    font:400 clamp(9px,.9cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .qc__title{
    margin:0;font-family:var(--gb-serif);font-weight:400;
    font-size:clamp(17px,2cqw,27px);line-height:1.12;color:var(--ink);
  }
  .qc__desc{
    margin:0;font:300 clamp(10px,1cqw,13px)/1.55 var(--gb-sans);color:rgba(44,32,24,.7);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }

  .work__nav{display:flex;align-items:center;gap:1.2cqw;padding-top:clamp(10px,1.6cqh,20px)}
  .work__arrow{
    cursor:pointer;
    width:clamp(30px,3.2cqw,44px);height:clamp(30px,3.2cqw,44px);
    border-radius:50%;border:1px solid rgba(44,32,24,.35);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font:400 clamp(12px,1.2cqw,17px)/1 var(--gb-sans);color:var(--ink);
    transition:background 240ms var(--ease),opacity 240ms var(--ease);
  }
  .work__arrow:hover{background:rgba(250,246,239,.6)}
  .work__arrow[disabled]{opacity:.3;cursor:default}
  .work__prog{flex:1;height:1px;background:rgba(44,32,24,.22);position:relative;margin-left:1.4cqw}
  .work__prog i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);width:0;transition:width 600ms var(--ease)}

  .work__lead{
    position:absolute;left:0;top:0;
    width:clamp(46px,5cqw,74px);height:clamp(46px,5cqw,74px);object-fit:contain;
    pointer-events:none;z-index:8;
    transform:translate(-50%,-50%) scale(.4);opacity:0;
    transition:transform 420ms cubic-bezier(.34,1.56,.64,1),opacity 300ms ease;
    filter:drop-shadow(0 10px 20px rgba(44,32,24,.2));
  }

  .colophon{
    padding-top:clamp(12px,2cqh,24px);
    display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;
    font:400 clamp(9px,1cqw,12px)/1 var(--gb-sans);
    letter-spacing:.16em;text-transform:uppercase;color:rgba(44,32,24,.6);
  }
  .colophon a:hover{color:var(--ink)}

  @keyframes gspin{to{transform:rotate(360deg)}}
  @keyframes gscribble{
    0%{stroke-dashoffset:240}
    30%{stroke-dashoffset:0}
    64%{stroke-dashoffset:0}
    100%{stroke-dashoffset:-240}
  }

  @media (max-width:720px){
    .hero{min-height:560px}
    .nav{padding:12px 20px;gap:16px}
    .nav__group{gap:16px;font-size:9px}
    .claim{padding:34px 24px;gap:16px;max-width:88vw}
    .claim h1{font-size:clamp(30px,9vw,44px);max-width:none}
    .claim__lede{font-size:15px;max-width:38ch}
    .claim__areas{font-size:9px;gap:10px;flex-wrap:wrap;justify-content:center}
    .cutout{display:none}
    .work__field{padding:48px 0 40px}
    .work__frame{padding-inline:20px}
    .work__eyebrow,.work__count{font-size:10px}
    .work__chips{gap:8px}
    .work__chips button{font-size:10px;padding:7px 13px}
    .qc{width:78vw;margin-right:16px;gap:10px}
    .qc__thumb{height:44vw}
    .qc__corner{width:52px;height:52px}
    .qc__title{font-size:clamp(18px,5.4vw,26px)}
    .qc__desc{font-size:13px}
    .work__arrow{width:38px;height:38px;font-size:15px}
    .work__lead{display:none}
    .colophon{flex-direction:column;gap:6px;font-size:10px}
  }

  @media (prefers-reduced-motion:reduce){
    .nav__mark{animation:none}
    .scrib path{animation:none;stroke-dashoffset:0}
    .cutout,.qc__corner,.work__lead{transition:opacity 200ms linear}
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <nav class="nav">
    <div class="nav__group">
      <a href="#work">Work</a>
      <a href="#" aria-disabled="true">Resume</a>
    </div>
    <svg class="nav__mark" viewBox="0 0 342 342" aria-hidden="true">
      <path d="M-0.000100708 116.548C-2.1472e-05 86.7444 24.1604 62.5842 53.9637 62.584L62.6769 62.584L62.6769 54.0338C62.677 24.2303 86.8379 0.0693126 116.641 0.0692465C145.768 0.0694926 169.504 23.1454 170.567 52.0119C171.596 23.1135 195.348 0.00156942 224.497 0.00157481C254.3 0.00186074 278.461 24.1623 278.461 53.9654V62.6786L287.011 62.6793C316.814 62.6795 340.974 86.8397 340.975 116.643C340.974 145.773 317.893 169.512 289.022 170.57C317.925 171.593 341.043 195.345 341.043 224.498C341.043 254.302 316.882 278.463 287.078 278.463L278.366 278.464V287.012C278.366 316.816 254.205 340.977 224.401 340.977C195.271 340.977 171.532 317.896 170.474 289.025C169.451 317.928 145.698 341.044 116.545 341.045C86.742 341.044 62.5817 316.884 62.5816 287.081L62.5816 278.368L54.0314 278.368C24.2281 278.367 0.0677928 254.207 0.0675703 224.404C0.067575 195.277 23.1426 171.54 52.0088 170.476C23.1111 169.447 -2.29986e-07 145.697 -0.000100708 116.548ZM75.496 170.253C127.6 170.488 169.767 212.708 169.767 264.758C169.767 264.9 169.765 265.043 169.764 265.186C169.767 265.186 169.77 265.187 169.773 265.187C169.771 264.9 169.767 264.613 169.767 264.326C169.767 212.368 211.976 170.248 264.042 170.248C264.33 170.248 264.617 170.252 264.904 170.255C264.903 169.963 264.902 169.671 264.898 169.38C264.613 169.382 264.327 169.385 264.041 169.385C212.265 169.385 170.239 127.733 169.773 76.1751C169.771 76.1751 169.768 76.175 169.765 76.1751C169.531 128.025 127.455 170.011 75.4967 170.246L75.496 170.253ZM170.537 170.508V170.539H170.505V170.508H170.537Z"></path>
    </svg>
    <div class="nav__group nav__group--right">
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <div class="play" id="play">
      <div class="claim">
        <span class="claim__tick claim__tick--tl"></span>
        <span class="claim__tick claim__tick--tr"></span>
        <span class="claim__tick claim__tick--bl"></span>
        <span class="claim__tick claim__tick--br"></span>

        <h1>I design across screens and spaces.</h1>

        <p class="claim__lede">Gatha is a product designer and an architect.</p>

        <div class="claim__areas">
          <span>Education</span>
          <span class="claim__dot"></span>
          <span>Healthcare</span>
          <span class="claim__dot"></span>
          <span>AI</span>
          <span class="claim__dot"></span>
          <span>0-to-1</span>
        </div>
      </div>
      <!-- cutouts + scribbles injected here -->
    </div>
  </section>

  <section class="work" id="work" data-solidbg>
    <div class="work__field" id="workField">
      <div class="work__frame">
        <div class="work__head">
          <span class="work__eyebrow">Selected work</span>
          <span class="work__count" id="workCount">01 / 05</span>
        </div>

        <div class="work__chips" id="workChips"></div>

        <div class="work__strip-wrap" id="workStripWrap">
          <div class="work__strip" id="workStrip"></div>
        </div>

        <div class="work__nav">
          <button class="work__arrow" id="workPrev" type="button" aria-label="Previous project">&#8592;</button>
          <button class="work__arrow" id="workNext" type="button" aria-label="Next project">&#8594;</button>
          <div class="work__prog"><i id="workProg"></i></div>
        </div>

        <footer class="colophon">
          <span>Gatha Bhakta — portfolio 2026</span>
          <a href="mailto:gahtabhakta@gmail.com">gahtabhakta@gmail.com</a>
        </footer>
      </div>
      <img class="work__lead" id="workLead" alt="">
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  var stage  = document.getElementById('stage');
  var play   = document.getElementById('play');
  var hero   = document.querySelector('.hero');
  var nav    = document.querySelector('.nav');
  var solids = document.querySelectorAll('[data-solidbg]');
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  // publish the nav height so the hero can pull up under it and centre in
  // the full viewport
  function measureNav(){
    document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  }
  measureNav();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureNav);

  /* ── scroll: scrollbar flip · hero recede · nav contrast ── */
  // As the pink work panel slides up, the hero eases back — a barely-there
  // scale-down (max 3%) and a fade — and the sticky nav swaps its transparent
  // fill for cream once a solid non-cream section is behind it.
  var pending = false;
  function paint(){
    pending = false;
    var ch = stage.clientHeight, st = stage.scrollTop;

    stage.setAttribute('data-sb', st > ch * 0.5 ? 'white' : 'pink');

    var p = Math.min(1, st / (ch * 0.62));
    hero.style.opacity = (1 - p * 0.5).toFixed(3);
    hero.style.transform = reduce ? 'none' : 'scale(' + (1 - p * 0.03).toFixed(4) + ')';

    var onSolid = false;
    for (var i = 0; i < solids.length; i++){
      var r = solids[i].getBoundingClientRect();
      if (r.top <= 0 && r.bottom > 0){ onSolid = true; break; }
    }
    nav.classList.toggle('nav--solid', onSolid);
  }
  function onScroll(){ if (!pending){ pending = true; requestAnimationFrame(paint); } }
  stage.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', function(){ measureNav(); onScroll(); });
  onScroll();

  /* ── flying cutouts ─────────────────────────── */
  // h = on-screen height in px. matcha / nycmodel / Gatha 1 are narrow crops,
  // so they carry a taller box to match the visual mass of the wider cut-outs.
  var CUTS = [
    {file:'cheesecake.webp',      label:'cheesecake', h:109},
    {file:'CHAICROISSANT.webp',   label:'chai croissant', h:120},
    {file:'matcha.webp',          label:'matcha', h:184},
    {file:'nycmodel.webp',        label:'new york', h:116},
    {file:'Gatha 1.webp',         label:'gatha', h:190},
    {file:'wip logo 1.webp',      label:'mark', h:101}
  ];
  var SLOTS = [[430,-206],[455,8],[415,212]];

  function jitter(n){ return (Math.random() - 0.5) * n; }
  function makeSpread(){
    var left = [], right = [];
    SLOTS.forEach(function(s){
      var x = s[0], y = s[1];
      var dx = -Math.abs(jitter(26)), dy = jitter(30), rot = Math.round(jitter(22));
      left.push ({tx: Math.round(-x - dx), ty: Math.round(y + dy), rot:-rot, sc:1});
      right.push({tx: Math.round( x + dx), ty: Math.round(y + dy), rot: rot, sc:1});
    });
    return left.concat(right);
  }

  var K = 1;
  function scaleFactor(){ return Math.max(0.62, Math.min(1.5, window.innerWidth / 1160)); }

  var cutEls = CUTS.map(function(c, i){
    var el = document.createElement('img');
    el.className = 'cutout';
    el.alt = '';
    el.src = 'assets/' + encodeURIComponent(c.file);
    el.dataset.baseH = c.h;
    el.onerror = function(){
      // graceful placeholder until the real sticker art is dropped into /assets
      var ph = document.createElement('div');
      ph.className = 'cutout cutout--ph';
      ph.dataset.baseH = c.h;
      ph.style.height = (c.h * K) + 'px';
      ph.style.width  = Math.round(c.h * 1.35 * K) + 'px';
      ph.textContent = c.label;
      el.replaceWith(ph);
      cutEls[i] = ph;
      resize();
    };
    play.appendChild(el);
    return el;
  });

  function resize(){
    K = scaleFactor();
    cutEls.forEach(function(el){
      var h = (el.dataset.baseH | 0) * K;
      el.style.height = h + 'px';
      if (el.classList.contains('cutout--ph')) el.style.width = Math.round(h * 1.35) + 'px';
    });
    if (spread) applyState(true);   // keep the edge clamp honest after a resize
  }

  // Pull a sticker's horizontal offset back in if the spread would push its
  // box off the screen — leaves a 32px gutter. Vertical spread is untouched.
  function clampX(el, tx){
    var half = (el.offsetWidth || (el.dataset.baseH | 0) * K * 1.4) / 2;
    var lim = Math.max(0, window.innerWidth / 2 - half - 32);
    return Math.max(-lim, Math.min(lim, tx));
  }

  var spread = null;
  function applyState(on){
    cutEls.forEach(function(el, i){
      if (on && spread){
        var s = spread[i];
        el.style.transitionDelay = (60 * i) + 'ms';
        el.style.transform = 'translate(-50%,-50%) translate(' + clampX(el, s.tx * K) + 'px,' + (s.ty * K) + 'px) rotate(' + s.rot + 'deg) scale(' + s.sc + ')';
        el.style.opacity = '1';
      } else {
        el.style.transitionDelay = (40 * (5 - i)) + 'ms';
        el.style.transform = 'translate(-50%,-50%) scale(.55)';
        el.style.opacity = '0';
      }
    });
  }
  resize();
  window.addEventListener('resize', resize);

  play.addEventListener('mouseenter', function(){ spread = makeSpread(); applyState(true); });
  play.addEventListener('mouseleave', function(){ applyState(false); spread = null; });

  /* ── re-rolling scribbles (indices 0, 1, 4) ── */
  var STAR = 'M20 5c1.6 12.5 3.5 14.4 15 15-11.5.6-13.4 2.5-15 15-1.6-12.5-3.5-14.4-15-15 11.5-.6 13.4-2.5 15-15z';
  var HEART = 'M20 33C10 25 5 20.5 5 15a7.5 7.5 0 0 1 15-3 7.5 7.5 0 0 1 15 3c0 5.5-5 10-15 18z';
  var SCRIBS = [
    {i:0, size:50, d:STAR},
    {i:1, size:46, d:HEART},
    {i:4, size:50, d:STAR}
  ];
  var scribEls = SCRIBS.map(function(s){
    var wrap = document.createElement('div');
    wrap.className = 'scrib scrib--' + s.i;
    wrap.innerHTML = '<svg width="' + s.size + '" height="' + s.size + '" viewBox="0 0 40 40"><path d="' + s.d + '"></path></svg>';
    play.appendChild(wrap);
    return {el:wrap, i:s.i};
  });
  function r(a,b){ return a + Math.random() * (b - a); }
  function rollScribs(){
    scribEls.forEach(function(o){
      var x = (o.i % 2) ? r(94.6, 96.0) : r(4.0, 5.4);
      var y = r(8, 88);
      var rot = Math.round(r(-28, 28));
      o.el.style.left = (Math.round(x * 10) / 10) + '%';
      o.el.style.top  = (Math.round(y * 10) / 10) + '%';
      o.el.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
    });
  }
  rollScribs();
  if (!reduce) setInterval(rollScribs, 6500);

  /* ── work section — 7b × 7c hybrid carousel ─────────────
     filtered filmstrip · arrows + wheel walk it · hovering a card
     tints the field, springs 4 cut-outs onto the thumb corners (7c)
     and trails a 5th on the cursor (7b) */
  (function workCarousel(){
    var field   = document.getElementById('workField');
    var strip   = document.getElementById('workStrip');
    var wrap    = document.getElementById('workStripWrap');
    var chipBox = document.getElementById('workChips');
    var countEl = document.getElementById('workCount');
    var progEl  = document.getElementById('workProg');
    var prevB   = document.getElementById('workPrev');
    var nextB   = document.getElementById('workNext');
    var lead    = document.getElementById('workLead');
    if (!field) return;

    var A = 'assets/', enc = encodeURIComponent;
    var PROJECTS = [
      {no:'01', img:'nycmodel.webp',      tag:'Interior',   meta:'Interior · 2024',            title:'House of small rooms',                     desc:'A 62 m² flat re-planned as nine thresholds instead of four rooms.',  tint:'#EDD8CC'},
      {no:'02', img:'matcha.webp',        tag:'AI',         meta:'AI · 0-to-1 · 2026',         title:'A copilot that admits it is unsure',        desc:'Confidence made legible, so people stop trusting the wrong answer.',      tint:'#D8E8D4'},
      {no:'03', img:'CHAICROISSANT.webp', tag:'Education',   meta:'Education · 2025',           title:'A museum game for ten-year-olds',           desc:'Forty minutes in a gallery, played on one shared tablet.',                tint:'#FADCEB'},
      {no:'04', img:'cheesecake.webp',    tag:'Research',    meta:'Research · growth · 2025',   title:'Where platform growth actually comes from', desc:'Nine months of interviews turned into three decisions.',                  tint:'#F2EDE4'},
      {no:'05', img:'Gatha 1.webp',       tag:'Healthcare', meta:'Healthcare · 2025',          title:'Ward rounds, rebuilt',                      desc:"Eleven minutes saved per round, on the ward's own hardware.",             tint:'#E2ECE6'}
    ];
    var TAGS = ['All','Interior','AI','Education','Research','Healthcare'];
    var CORNER_SEQ = ['matcha.webp','CHAICROISSANT.webp','cheesecake.webp','Gatha 1.webp','wip logo 1.webp','nycmodel.webp'];

    var workSec = document.getElementById('work');
    var sel = [];                 // selected tag names — multi-select; empty = all
    var car = 0, hot = null;
    var cur = { x:0, y:0, on:false };

    var chipEls = TAGS.map(function(t, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = t;
      b.addEventListener('click', function(){
        if (i === 0){ sel = []; }
        else {
          var at = sel.indexOf(t);
          if (at === -1) sel.push(t); else sel.splice(at, 1);
        }
        car = 0; hot = null; render();
      });
      chipBox.appendChild(b);
      return b;
    });

    var cardEls = PROJECTS.map(function(p, i){
      var el = document.createElement('article');
      el.className = 'qc';
      var corners = '';
      for (var k = 0; k < 4; k++){
        corners += '<img class="qc__corner" data-c="' + k + '" alt="" src="' + A + enc(CORNER_SEQ[(i + k) % 6]) + '">';
      }
      el.innerHTML =
        '<div class="qc__thumb"><img class="qc__img" alt="" src="' + A + enc(p.img) + '">' + corners + '</div>' +
        '<div class="qc__meta"><span>' + p.no + '</span><span>' + p.meta + '</span></div>' +
        '<h3 class="qc__title">' + p.title + '</h3>' +
        '<p class="qc__desc">' + p.desc + '</p>';
      el.addEventListener('mouseenter', function(){ if (!el.classList.contains('is-hidden')){ hot = i; render(); } });
      el.addEventListener('click', function(){
        var pos = filtered().indexOf(i);
        if (pos !== -1) car = pos;
        hot = i; render();
      });
      strip.appendChild(el);
      return el;
    });

    function filtered(){
      var out = [];
      for (var i = 0; i < PROJECTS.length; i++){
        if (sel.length === 0 || sel.indexOf(PROJECTS[i].tag) !== -1) out.push(i);
      }
      return out;
    }
    function pad(x){ return String(x).padStart(2, '0'); }

    function step(d){
      var n = filtered().length;
      car = Math.max(0, Math.min(n - 1, car + d));
      render();
    }

    function render(){
      var list = filtered(), n = list.length;
      if (car > n - 1) car = Math.max(0, n - 1);

      chipEls.forEach(function(b, i){
        var on = i === 0 ? sel.length === 0 : sel.indexOf(TAGS[i]) !== -1;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      cardEls.forEach(function(el, i){
        var pos = list.indexOf(i);
        el.classList.toggle('is-hidden', pos === -1);
        el.classList.toggle('is-current', pos === car);
        el.classList.toggle('is-hot', hot === i);
      });

      var first = cardEls[list[0]];
      var stepPx = first.offsetWidth + parseFloat(getComputedStyle(first).marginRight || 0);
      strip.style.transform = 'translateX(' + (-car * stepPx) + 'px)';

      field.style.background = hot != null ? PROJECTS[hot].tint : '';

      countEl.textContent = pad(n ? Math.min(car + 1, n) : 0) + ' / ' + pad(n);
      progEl.style.width = n ? ((car + 1) / n * 100) + '%' : '0';
      prevB.disabled = car <= 0;
      nextB.disabled = car >= n - 1;

      paintLead();
    }

    function paintLead(){
      var base = 'translate(-50%,-50%) translate(' + cur.x + 'px,' + cur.y + 'px) ';
      if (hot != null && cur.on){
        if (lead.src.indexOf(enc(PROJECTS[hot].img)) === -1) lead.src = A + enc(PROJECTS[hot].img);
        lead.style.opacity = '1';
        lead.style.transform = base + 'scale(1) rotate(' + (hot % 2 ? 10 : -10) + 'deg)';
      } else {
        lead.style.opacity = '0';
        lead.style.transform = base + 'scale(.4)';
      }
    }

    var rafPend = false;
    field.addEventListener('mousemove', function(e){
      var r = field.getBoundingClientRect();
      cur.x = e.clientX - r.left; cur.y = e.clientY - r.top; cur.on = true;
      if (!rafPend){ rafPend = true; requestAnimationFrame(function(){ rafPend = false; paintLead(); }); }
    });
    field.addEventListener('mouseleave', function(){ cur.on = false; hot = null; render(); });

    // wheel walks the strip — but ONLY once the panel has fully settled
    // against the top; before that the wheel scrolls the panel into place.
    var wheelAt = 0;
    wrap.addEventListener('wheel', function(e){
      if (workSec.getBoundingClientRect().top > 1) return;   // still settling → let the page scroll
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 4) return;
      var n = filtered().length;
      var canGo = d > 0 ? car < n - 1 : car > 0;
      if (!canGo) return;                       // at an end → release: wheel scrolls the page
      e.preventDefault();                       // walking the carousel — hold the page still,
      var now = Date.now();                     // even through the step throttle
      if (now - wheelAt < 320) return;
      wheelAt = now;
      step(d > 0 ? 1 : -1);
    }, { passive:false });

    prevB.addEventListener('click', function(){ step(-1); });
    nextB.addEventListener('click', function(){ step(1); });
    window.addEventListener('resize', render);

    render();
  })();
})();
</script>
</body>
</html>
